name: GoreeCloud dashboard staging image

on:
  pull_request:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish exact-revision staging image to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: goreecloud-dashboard-staging-image-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGING_IMAGE: ghcr.io/goreecloud/goreecloud-network-dashboard
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  build-staging-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
            echo "Expected source revision $SOURCE_SHA but checked out $actual_sha" >&2
            exit 1
          fi
          echo "Verified exact dashboard source revision: $SOURCE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Create local build config
        run: echo '{}' > .local-config.json

      - name: Download exact IronRDP v0.0.2 TypeScript assets
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: '*.ts'
          out-file-path: public/ironrdp-pkg

      - name: Download exact IronRDP v0.0.2 JavaScript assets
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: '*.js'
          out-file-path: public/ironrdp-pkg

      - name: Download exact IronRDP v0.0.2 WebAssembly asset
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: ironrdp_web_bg.wasm
          out-file-path: public/ironrdp-pkg

      - name: Run GoreeCloud source-integrity validation
        run: bash scripts/validate-goreecloud-dashboard.sh

      - name: Build dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_DASHBOARD_VERSION: staging-${{ env.SOURCE_SHA }}

      - name: Verify static build output
        shell: bash
        run: |
          set -euo pipefail
          test -d out
          test -n "$(find out -type f -print -quit)"
          tar -cf - out | sha256sum | tee staging-dashboard-output-sha256.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide publication mode
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.publication.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-revision staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: ${{ env.STAGING_IMAGE }}:staging-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            goreecloud.environment=staging

      - name: Write dashboard staging image manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > goreecloud-dashboard-staging-image.env <<EOF
          GOREECLOUD_NETWORK_DASHBOARD_IMAGE=${STAGING_IMAGE}:staging-${SOURCE_SHA}
          GOREECLOUD_NETWORK_DASHBOARD_SOURCE_REVISION=${SOURCE_SHA}
          EOF

          {
            echo '### GoreeCloud dashboard staging image contract'
            echo
            echo "Source revision: \`${SOURCE_SHA}\`"
            echo
            echo '```dotenv'
            cat goreecloud-dashboard-staging-image.env
            echo '```'
            echo
            if [[ "${{ steps.publication.outputs.publish }}" == "true" ]]; then
              echo 'The exact-revision dashboard image was published to GHCR.'
            else
              echo 'The dashboard image was built for validation only and was not published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging image evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-dashboard-staging-image-evidence-${{ env.SOURCE_SHA }}
          path: |
            goreecloud-dashboard-staging-image.env
            staging-dashboard-output-sha256.txt
          if-no-files-found: error
          retention-days: 14
