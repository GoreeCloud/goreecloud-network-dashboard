name: GoreeCloud dashboard validation

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goreecloud-dashboard-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate GoreeCloud privacy boundaries
        run: bash scripts/validate-goreecloud-dashboard.sh

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Create local build config
        run: echo '{}' > .local-config.json

      # The inherited dashboard currently requires pinned IronRDP web assets at
      # build time. Validation downloads the exact inherited v0.0.2 release with
      # read-only repository permissions; it does not publish or upload assets.
      - name: Download pinned IronRDP TypeScript assets
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: "*.ts"
          out-file-path: public/ironrdp-pkg

      - name: Download pinned IronRDP JavaScript assets
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: "*.js"
          out-file-path: public/ironrdp-pkg

      - name: Download pinned IronRDP WebAssembly asset
        uses: robinraju/release-downloader@v1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: ironrdp_web_bg.wasm
          out-file-path: public/ironrdp-pkg

      - name: Build production dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_DASHBOARD_VERSION: validation-${{ github.sha }}
